[package]
name = "lang-rvsdg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bitflags = "2.11.0"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.3"
either = "1.15"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
llvm-ir = { git = "https://github.com/ConnorVoisey/llvm-ir", branch = "llvm-21", features = [
    "llvm-22",
] }
pretty_assertions = "1.4.1"
rayon = "1.10"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
smallvec = "1.15.1"
target-lexicon = "0.13.5"
tempfile = "3.27.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-chrome = "0.7.2"
thiserror = "2.0.18"

[dev-dependencies]
pretty_assertions = "1.4.1"
