[package]
name = "lang-rvsdg"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.11.0"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
either = "1.15"
indicatif = "0.17"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
libc = "0.2"
llvm-ir = { git = "https://github.com/ConnorVoisey/llvm-ir", branch = "llvm-21", features = [
    "llvm-22",
] }
pretty_assertions = "1.4.1"
rayon = "1.10"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15.1"
target-lexicon = "0.13.5"
tempfile = "3.27.0"
# Linux perf_event_open wrapper for in-process hardware counters
# (compile-time benchmark). Gracefully degrades to wall-clock when the
# kernel denies counter access (perf_event_paranoid).
perf-event = "0.4"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-chrome = "0.7.2"
thiserror = "2.0.18"

[dev-dependencies]
pretty_assertions = "1.4.1"
